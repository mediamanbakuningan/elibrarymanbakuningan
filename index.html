<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
<title>E-LIBRARY | Sistem Perpustakaan Digital Sekolah</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
    /* PLATINUM THEME CSS EXTENSIONS */
    body { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #cbd5e1 100%); background-attachment: fixed; font-family: 'Inter', system-ui, sans-serif; color: #1e293b; margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    #e-library-app { display: block; width: 100%; height: 100%; }

    .glass-panel { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }

    /* Header Platinum 3D Timbul Baru */
    .header-box { background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(241,245,249,0.9) 100%); border: 1px solid rgba(255,255,255,1); box-shadow: inset 0 2px 4px rgba(255,255,255,0.8), 0 4px 10px rgba(0,0,0,0.05); border-radius: 1.5rem; padding: 1.5rem 2rem; border-left: 8px solid #059669; }

    .text-3d-elegant {
      background: linear-gradient(180deg, #10b981 0%, #047857 50%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(2px 2px 1px rgba(0,0,0,0.2)) drop-shadow(-1px -1px 1px rgba(255,255,255,0.9));
      display: inline-block;
    }

    .platinum-gradient { background: linear-gradient(to right, #047857, #064e3b, #047857); background-size: 200% auto; color: white; transition: 0.5s; }
    .platinum-gradient:hover { background-position: right center; }
    .metallic-text { background: linear-gradient(to right, #064e3b, #022c22, #064e3b); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .hide { display: none !important; }
    .app-viewport { height: 100vh; height: 100dvh; }
    .scroll-smooth { -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 1.5rem); }
    .hide-scroll::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

  <div id='e-library-app'>
    <div class='fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[1000] flex flex-col items-center justify-center p-4 hide' id='scanner-modal'>
      <div class='w-full max-w-md bg-white rounded-[2rem] overflow-hidden shadow-2xl flex flex-col'>
        <div class='p-5 bg-emerald-800 text-white flex justify-between items-center'><h3 class='font-black text-lg flex items-center gap-2'><i class='w-5 h-5' data-lucide='camera'></i> Scanner</h3><button class='text-emerald-100 hover:text-white' onclick='closeScanner()'><i class='w-6 h-6' data-lucide='x'></i></button></div>
        <div class='p-4 bg-slate-100 flex-1 flex flex-col justify-center items-center' style='min-height: 350px;'><div class='w-full overflow-hidden rounded-xl border-2 border-slate-300 bg-black' id='reader'></div></div>
        <div class='p-4 text-center text-xs text-slate-500 font-bold bg-white'>Posisikan Barcode di area kotak. Hindari pantulan cahaya.</div>
      </div>
    </div>

    <div class='flex app-viewport overflow-hidden pb-20 lg:pb-0'>
      <aside class='w-72 glass-panel hidden lg:flex flex-col p-6 m-4 rounded-3xl z-10 shadow-lg border-emerald-100'>
        <div class='flex items-center gap-3 mb-10 px-2'><div class='platinum-gradient p-3 rounded-2xl shadow-lg'><i class='text-white w-6 h-6' data-lucide='library'></i></div><div><h1 class='font-black text-2xl metallic-text tracking-tighter'>E-LIBRARY</h1><p class='text-[10px] font-bold text-emerald-600 uppercase tracking-widest'>Sekolah Digital</p></div></div>
        <nav class='flex-1 space-y-2' id='sidebar-nav'>
          <button class='w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition font-bold' id='nav-dashboard' onclick='switchTab("dashboard")'><i class='w-5 h-5' data-lucide='home'></i> Beranda</button>
          <button class='w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition font-bold' id='nav-books' onclick='switchTab("books")'><i class='w-5 h-5' data-lucide='book-open'></i> Buku</button>
          <button class='w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition font-bold' id='nav-members' onclick='switchTab("members")'><i class='w-5 h-5' data-lucide='users'></i> Anggota</button>
          <button class='w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition font-bold' id='nav-circulation' onclick='switchTab("circulation")'><i class='w-5 h-5' data-lucide='scan-line'></i> Sirkulasi</button>
          <button class='w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition font-bold' id='nav-stats' onclick='switchTab("stats")'><i class='w-5 h-5' data-lucide='bar-chart-3'></i> Statistik</button>
          <button class='w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition font-bold' id='nav-reports' onclick='switchTab("reports")'><i class='w-5 h-5' data-lucide='file-text'></i> Laporan</button>
          <button class='w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition font-bold' id='nav-settings' onclick='switchTab("settings")'><i class='w-5 h-5' data-lucide='settings'></i> Pengaturan</button>
        </nav>
        <div class='mt-auto p-4 bg-white/40 rounded-2xl flex flex-col items-center justify-center gap-2 border border-white/50'>
          <p class='text-[8px] text-slate-500 font-bold text-center mt-2'>@2026 made by Albustomipauzi</p>
        </div>
      </aside>

      <nav class='lg:hidden fixed bottom-0 left-0 right-0 glass-panel border-t border-slate-200 z-50 pb-safe shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] bg-white/90'>
        <div class='flex overflow-x-auto hide-scroll px-2 py-2 gap-2 scroll-smooth' style='scrollbar-width:none; -ms-overflow-style:none;'>
          <button class='flex flex-col items-center justify-center py-2 px-3 text-slate-400 transition min-w-[70px] shrink-0 rounded-2xl' id='mob-dashboard' onclick='switchTab("dashboard")'><i class='w-6 h-6 mb-1' data-lucide='home'></i><span class='text-[9px] font-bold'>Beranda</span></button>
          <button class='flex flex-col items-center justify-center py-2 px-3 text-slate-400 transition min-w-[70px] shrink-0 rounded-2xl' id='mob-books' onclick='switchTab("books")'><i class='w-6 h-6 mb-1' data-lucide='book-open'></i><span class='text-[9px] font-bold'>Buku</span></button>
          <button class='flex flex-col items-center justify-center py-2 px-3 text-slate-400 transition min-w-[70px] shrink-0 rounded-2xl' id='mob-members' onclick='switchTab("members")'><i class='w-6 h-6 mb-1' data-lucide='users'></i><span class='text-[9px] font-bold'>Anggota</span></button>
          <button class='flex flex-col items-center justify-center py-2 px-3 text-slate-400 transition min-w-[70px] shrink-0 rounded-2xl' id='mob-circulation' onclick='switchTab("circulation")'><i class='w-6 h-6 mb-1' data-lucide='scan-line'></i><span class='text-[9px] font-bold'>Scan</span></button>
          <button class='flex flex-col items-center justify-center py-2 px-3 text-slate-400 transition min-w-[70px] shrink-0 rounded-2xl' id='mob-stats' onclick='switchTab("stats")'><i class='w-6 h-6 mb-1' data-lucide='bar-chart-3'></i><span class='text-[9px] font-bold'>Statistik</span></button>
          <button class='flex flex-col items-center justify-center py-2 px-3 text-slate-400 transition min-w-[70px] shrink-0 rounded-2xl' id='mob-reports' onclick='switchTab("reports")'><i class='w-6 h-6 mb-1' data-lucide='file-text'></i><span class='text-[9px] font-bold'>Laporan</span></button>
          <button class='flex flex-col items-center justify-center py-2 px-3 text-slate-400 transition min-w-[70px] shrink-0 rounded-2xl' id='mob-settings' onclick='switchTab("settings")'><i class='w-6 h-6 mb-1' data-lucide='settings'></i><span class='text-[9px] font-bold'>Menu</span></button>
        </div>
      </nav>

      <main class='flex-1 overflow-y-auto scroll-smooth p-4 md:p-8 z-0 relative w-full' id='main-scroll-area'>
        <header class='mb-8 header-box flex flex-col md:flex-row md:justify-between md:items-center gap-4'>
          <div>
            <p class='text-emerald-700 text-xs md:text-sm font-bold tracking-widest uppercase mb-1' id='header-subtitle'>MEMUAT...</p>
            <h2 class='text-2xl md:text-4xl lg:text-5xl font-black text-3d-elegant uppercase leading-tight py-1' id='header-title'>Memuat Sistem</h2>
          </div>
          <div class='hidden md:block'>
            <div class='bg-emerald-50 text-emerald-800 px-5 py-3 rounded-xl font-bold text-sm flex items-center gap-2 border border-emerald-200 shadow-sm'>
              <i class='w-5 h-5' data-lucide='calendar-days'></i> <span id='current-date-disp'></span>
            </div>
          </div>
        </header>
        <div class='w-full' id='app-content'></div>
      </main>
    </div>

    <div class='fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[400] flex items-center justify-center p-4 hide' id='modal-book'>
      <div class='glass-panel w-full max-w-lg rounded-[2.5rem] p-8 md:p-10 shadow-2xl'>
        <h3 class='text-2xl font-black mb-8 text-emerald-800'>Katalog Buku Baru</h3>
        <form class='space-y-4' id='form-book' onsubmit='submitBook(event)'>
          <div><label class='text-[10px] font-black text-slate-500 uppercase tracking-widest'>Judul Lengkap</label><input class='w-full mt-1 p-4 bg-white/60 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-400 border border-white/50 shadow-sm' id='book-title' required type='text'/></div>
          <div class='grid grid-cols-2 gap-4'>
            <div><label class='text-[10px] font-black text-slate-500 uppercase tracking-widest'>Penulis</label><input class='w-full mt-1 p-4 bg-white/60 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-400 border border-white/50 shadow-sm' id='book-author' required type='text'/></div>
            <div><label class='text-[10px] font-black text-slate-500 uppercase tracking-widest'>Kategori</label><select class='w-full mt-1 p-4 bg-white/60 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-400 border border-white/50 shadow-sm' id='book-category'><option>Pendidikan</option><option>Sains</option><option>Novel</option><option>Sejarah</option><option>Referensi</option></select></div>
          </div>
          <div class='grid grid-cols-3 gap-4'>
            <div class='col-span-2'><label class='text-[10px] font-black text-slate-500 uppercase tracking-widest'>Basis Barcode/ISBN</label><input class='w-full mt-1 p-4 bg-white/60 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-400 border border-white/50 shadow-sm' id='book-isbn' placeholder='Misal: B-INDO' required type='text'/></div>
            <div><label class='text-[10px] font-black text-slate-500 uppercase tracking-widest'>Jml Eksemplar</label><input class='w-full mt-1 p-4 bg-white/60 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-400 border border-white/50 shadow-sm text-center font-bold' id='book-qty' max='100' min='1' required type='number' value='1'/></div>
          </div>
          <p class='text-[10px] text-emerald-600 font-bold'>*Jika eksemplar &gt; 1, sistem menggenerate barcode otomatis berurutan.</p>
          <div class='flex gap-4 pt-4'><button class='flex-1 font-bold text-slate-500 hover:bg-white/50 rounded-2xl py-4 transition' onclick='toggleModal("modal-book", false)' type='button'>Batal</button><button class='flex-[2] platinum-gradient rounded-2xl font-black shadow-lg py-4' type='submit'>Simpan Data</button></div>
        </form>
      </div>
    </div>

    <div class='fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[400] flex items-center justify-center p-4 hide' id='modal-member'>
      <div class='glass-panel w-full max-w-lg rounded-[2.5rem] p-8 md:p-10 shadow-2xl'>
        <h3 class='text-2xl font-black mb-8 text-emerald-800'>Registrasi Manual</h3>
        <form class='space-y-4' id='form-member' onsubmit='submitMember(event)'>
          <div><label class='text-[10px] font-black text-slate-500 uppercase tracking-widest'>ID Anggota / NISN</label><input class='w-full mt-1 p-4 bg-white/60 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-400 border border-white/50 shadow-sm' id='member-id' required type='text'/></div>
          <div><label class='text-[10px] font-black text-slate-500 uppercase tracking-widest'>Nama Lengkap</label><input class='w-full mt-1 p-4 bg-white/60 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-400 border border-white/50 shadow-sm' id='member-name' required type='text'/></div>
          <div class='grid grid-cols-2 gap-4'>
             <div><label class='text-[10px] font-black text-slate-500 uppercase tracking-widest'>Kelas</label><input class='w-full mt-1 p-4 bg-white/60 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-400 border border-white/50 shadow-sm' id='member-class' placeholder='Contoh: 9A' required type='text'/></div>
             <div><label class='text-[10px] font-black text-slate-500 uppercase tracking-widest'>Berlaku s/d</label><input class='w-full mt-1 p-4 bg-white/60 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-400 border border-white/50 shadow-sm' id='member-valid' placeholder='Juli 2027' required type='text'/></div>
          </div>
          <div><label class='text-[10px] font-black text-slate-500 uppercase tracking-widest'>Link Foto (Opsional)</label><input class='w-full mt-1 p-4 bg-white/60 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-400 border border-white/50 shadow-sm' id='member-photo' placeholder='https://...' type='text'/></div>
          <div class='flex gap-4 pt-4'><button class='flex-1 font-bold text-slate-500 hover:bg-white/50 rounded-2xl py-4 transition' onclick='toggleModal("modal-member", false)' type='button'>Batal</button><button class='flex-[2] platinum-gradient rounded-2xl font-black shadow-lg py-4' type='submit'>Daftarkan</button></div>
        </form>
      </div>
    </div>
  </div>

  <script type='text/javascript'>
    // =========================================================================
    // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    // =========================================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzd7tQQZy4tHkP8_0csSbrqLARbzqHoS6LDPJg_KZHmNioc6XT6DbxzOhBSnfFMl4sQnQ/exec"; 
    
    let appState = { activeTab: 'dashboard', setupError: false, books: [], members: [], loans: [], settings: { schoolName: 'PERPUSTAKAAN PLATINUM', logoLeft: '', logoRight: '' } };
    let scanMode = 'loan', html5QrcodeScanner = null, activeScanTarget = null;
    const $ = (id) => document.getElementById(id);
    
    const esc = (str) => { if (!str) return ''; return String(str).replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":"&#39;",'"':"&quot;"}[t] || t)); };
    const formatDateStr = (s) => { if(!s) return "-"; if(String(s).includes('T')) { try { const d = new Date(s); if (!isNaN(d.getTime())) return d.toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'}); } catch(e) {} } return s; };
    const formatRupiah = (n) => { const num = Number(n) || 0; return 'Rp ' + num.toLocaleString('id-ID'); };

    // --- SWEETALERT INTEGRATION ---
    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true });
    function showToast(msg, isError = false) { Toast.fire({ icon: isError ? 'error' : 'success', title: msg }); }
    function showLoader(show, text="Memproses...") { 
      if(show) { Swal.fire({ title: text, allowOutsideClick: false, allowEscapeKey: false, showConfirmButton: false, didOpen: () => { Swal.showLoading(); } }); } 
      else { Swal.close(); } 
    }
    function toggleModal(id, show) { const m = $(id); if(!m) return; if(show) m.classList.remove('hide'); else m.classList.add('hide'); }

    async function apiCall(action, payload = {}) {
      if (GAS_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_URL_HERE")) { appState.setupError = true; return null; }
      try {
        const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ action: action, payload: JSON.stringify(payload) }) });
        const json = await res.json();
        if(json.status === 'error') throw new Error(json.message);
        return json;
      } catch (err) {
        console.error("API Call Failed:", err);
        showToast(err.message || "Gagal menghubungi server", true);
        return null; 
      }
    }

    async function initApp() {
      try {
        showLoader(true, "Menghubungkan Server...");
        if($('current-date-disp')) $('current-date-disp').innerText = new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
        
        if (GAS_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_URL_HERE")) { appState.setupError = true; switchTab('dashboard'); showLoader(false); return; }
        const res = await apiCall('get_all_data');
        if (res && res.data) {
          appState.setupError = false; appState.books = res.data.books || []; appState.members = res.data.members || []; appState.loans = res.data.loans || []; appState.settings = res.data.settings || {};
        } else { appState.setupError = true; }
        switchTab(appState.activeTab); 
      } catch (e) { appState.setupError = true; switchTab('dashboard'); } finally { showLoader(false); }
    }

    function switchTab(tabId) {
      appState.activeTab = tabId;
      const schoolName = appState.settings.schoolName || 'PERPUSTAKAAN PLATINUM';
      const labels = {
        'dashboard': { title: 'BERANDA PERPUSTAKAAN', sub: esc(schoolName) },
        'books': { title: 'INVENTARIS BUKU', sub: esc(schoolName) },
        'members': { title: 'DATA ANGGOTA', sub: esc(schoolName) },
        'circulation': { title: 'SIRKULASI & SCAN', sub: esc(schoolName) },
        'stats': { title: 'STATISTIK & PENGUNJUNG TERAKTIF', sub: esc(schoolName) },
        'reports': { title: 'LAPORAN SISTEM', sub: esc(schoolName) },
        'settings': { title: 'PENGATURAN', sub: esc(schoolName) }
      };
      
      if($('header-title')) $('header-title').innerText = labels[tabId] ? labels[tabId].title : 'BERANDA PERPUSTAKAAN';
      if($('header-subtitle')) $('header-subtitle').innerText = labels[tabId] ? labels[tabId].sub : '';

      // Reset Styles
      ['dashboard','books','members','circulation','stats','reports','settings'].forEach(id => {
        if($('nav-'+id)) $('nav-'+id).className = 'w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition font-bold text-slate-500 hover:bg-emerald-50 hover:text-emerald-800';
        if($('mob-'+id)) { $('mob-'+id).className = 'flex flex-col items-center justify-center py-2 px-3 text-slate-400 hover:text-emerald-700 transition min-w-[70px] shrink-0 rounded-2xl'; $('mob-'+id).querySelector('span').classList.remove('text-emerald-700'); }
      });
      
      // Set Active
      if($('nav-'+tabId)) $('nav-'+tabId).className = 'w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition font-bold platinum-gradient shadow-md';
      if($('mob-'+tabId)) { $('mob-'+tabId).classList.add('bg-emerald-50', 'text-emerald-700'); $('mob-'+tabId).querySelector('span').classList.add('text-emerald-700'); }
      
      if($('main-scroll-area')) $('main-scroll-area').scrollTo(0,0);
      renderView();
    }

    function renderView() {
      const content = $('app-content'); if(!content) return;
      switch(appState.activeTab) {
        case 'dashboard': content.innerHTML = getDashboardHTML(); break;
        case 'books': content.innerHTML = getBooksHTML(); break;
        case 'members': content.innerHTML = getMembersHTML(); break;
        case 'circulation': content.innerHTML = getCirculationHTML(); break;
        case 'stats': content.innerHTML = getStatsHTML(); break;
        case 'reports': content.innerHTML = getReportsHTML(); window.updateCountsInReports(); break;
        case 'settings': content.innerHTML = getSettingsHTML(); populateSettings(); break;
        default: content.innerHTML = getDashboardHTML(); break;
      }
      try { lucide.createIcons(); } catch(e){}
    }

    function getDashboardHTML() {
      if (appState.setupError) {
        return `<div class="glass-panel p-8 md:p-12 rounded-[2rem] border-l-8 border-red-500 text-center shadow-xl mt-4 max-w-3xl mx-auto"><i data-lucide="server-crash" class="w-16 h-16 md:w-20 md:h-20 text-red-500 mx-auto mb-6"></i><h3 class="font-black text-slate-800 text-xl md:text-3xl tracking-tight">Koneksi Database Belum Diatur!</h3><p class="text-slate-500 mt-4 leading-relaxed text-xs md:text-sm">Aplikasi ini membutuhkan backend Google Apps Script. Buka file index.html Anda, cari dan ganti tulisan: <code class="bg-slate-200 text-slate-800 p-2 rounded-lg font-mono text-xs shadow-inner block mt-2">const GAS_URL = "URL_ANDA_DISINI";</code></p><button onclick="initApp()" class="mt-6 px-6 py-3 bg-emerald-800 text-white rounded-xl font-bold hover:bg-emerald-700 transition">Muat Ulang</button></div>`;
      }
      const borrowed = appState.books.filter(b => b.Status === 'borrowed').length;
      const available = appState.books.filter(b => b.Status === 'available').length;
      return `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-8">
          <div class="bg-white p-4 md:p-6 rounded-2xl md:rounded-3xl flex flex-col items-center md:items-start md:flex-row gap-3 md:gap-4 shadow-sm border border-slate-100 hover:border-emerald-500 transition duration-300"><div class="bg-emerald-50 p-3 md:p-4 rounded-xl md:rounded-2xl text-emerald-600"><i data-lucide="library" class="w-6 h-6"></i></div><div class="text-center md:text-left"><p class="text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Buku</p><p class="text-2xl md:text-3xl font-black text-slate-800">${appState.books.length}</p></div></div>

    async function payFine(loanId) {
      const result = await Swal.fire({ title: 'Tandai Lunas?', text: "Denda akan ditandai sudah dibayar.", icon: 'question', showCancelButton: true, confirmButtonColor: '#059669', cancelButtonColor: '#64748b', confirmButtonText: 'Ya, Lunas', cancelButtonText: 'Batal' });
      if(!result.isConfirmed) return;
      showLoader(true);
      const res = await apiCall('pay_fine', { loanId });
      if(res){ showToast(res.message); await initApp(); } else { showLoader(false); }
    }

    function setScanMode(mode) {
      scanMode = mode;
      $('tab-loan').className = `flex-1 py-3 md:py-4 rounded-[1rem] md:rounded-3xl font-black text-[10px] md:text-sm tracking-widest transition ${mode === 'loan' ? 'platinum-gradient shadow-md' : 'text-slate-400 hover:bg-slate-50'}`;
      $('tab-return').className = `flex-1 py-3 md:py-4 rounded-[1rem] md:rounded-3xl font-black text-[10px] md:text-sm tracking-widest transition ${mode === 'return' ? 'platinum-gradient shadow-md' : 'text-slate-400 hover:bg-slate-50'}`;
      $('scan-title').innerText = `MODE ${mode === 'loan' ? 'PEMINJAMAN' : 'PENGEMBALIAN'}`;
    }

    function openScanner(targetId) {
      if(!window.Html5Qrcode) { showToast("Library Scanner lambat dimuat.", true); return; }
      activeScanTarget = targetId; $('scanner-modal').classList.remove('hide');
      if(!html5QrcodeScanner) html5QrcodeScanner = new Html5Qrcode("reader");
      const config = { fps: 20, qrbox: { width: 250, height: 120 }, aspectRatio: 1.0, formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.QR_CODE ] };
      html5QrcodeScanner.start({ facingMode: "environment" }, config, (decodedText) => {
        if(activeScanTarget && $(activeScanTarget)) { $(activeScanTarget).value = decodedText.trim().replace(/\s/g, '_'); }
        showToast("Terbaca: " + decodedText); closeScanner();
      }, (error) => {}).catch((err) => { showToast("Kamera tidak diizinkan/ditemukan.", true); closeScanner(); });
    }
    function closeScanner() { $('scanner-modal').classList.add('hide'); if(html5QrcodeScanner) html5QrcodeScanner.stop().catch(e=>{}); activeScanTarget = null; }

    window.updateCountsInReports = function() {

    async function submitBook(e) {
      e.preventDefault(); showLoader(true);
      const payload = { title: $('book-title').value, author: $('book-author').value, category: $('book-category').value, isbn: $('book-isbn').value.trim(), qty: $('book-qty').value };
      const res = await apiCall('add_book', payload);
      if(res) { showToast(res.message); toggleModal('modal-book', false); $('form-book').reset(); $('book-qty').value = 1; await initApp(); } else { showLoader(false); }
    }

    async function submitMember(e) {
      e.preventDefault(); showLoader(true);
      const memId = $('member-id').value.trim();
      if(appState.members.some(m => String(m.MemberID).trim() === memId)) { showToast(`Gagal: ID/NISN '${memId}' sudah terdaftar!`, true); showLoader(false); return; }
      const payload = { memberId: memId, name: $('member-name').value.trim().toUpperCase(), class: $('member-class').value.trim().toUpperCase(), photoUrl: $('member-photo').value, validUntil: $('member-valid').value };
      const res = await apiCall('add_member', payload);
      if(res){ showToast(res.message); toggleModal('modal-member', false); $('form-member').reset(); await initApp(); } else { showLoader(false); }
    }

    async function submitCirculation(e) {
      e.preventDefault(); showLoader(true);
      const payload = { mode: scanMode, bookId: $('circ-book').value.trim(), memberId: $('circ-member') ? $('circ-member').value.trim() : '' };
      const res = await apiCall('process_circulation', payload);
      if(res){ showToast(res.message); $('circ-book').value = ''; if($('circ-member')) $('circ-member').value = ''; await initApp(); } else { showLoader(false); }
    }

    async function submitSettings(e) {
      e.preventDefault(); showLoader(true);
      const payload = { govName: $('set-gov').value, deptName: $('set-dept').value, schoolName: $('set-school').value, address: $('set-address').value, city: $('set-city').value, logoLeft: $('set-logo-l').value, logoRight: $('set-logo-r').value, principalName: $('set-pname').value, principalNip: $('set-pnip').value, librarianName: $('set-lname').value, librarianNip: $('set-lnip').value, loanDurationDays: $('set-loan-duration').value, finePerDay: $('set-fine-per-day').value };
      const res = await apiCall('save_settings', payload);
      if(res){ showToast(res.message); appState.setupError = false; await initApp(); } else { showLoader(false); }
    }

    async function deleteItem(sheet, id) {
      const result = await Swal.fire({ title: 'Hapus Data?', text: "Data tidak dapat dikembalikan!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#059669', cancelButtonColor: '#dc2626', confirmButtonText: 'Ya, Hapus!', cancelButtonText: 'Batal' });
      if(!result.isConfirmed) return;
      showLoader(true);
      const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ action: 'delete_item', sheet: sheet, id: id }) });
      if(res.ok){ showToast("Data Dihapus!"); await initApp(); } else { showToast("Gagal menghapus.", true); showLoader(false); }
    }

      if(!window.XLSX) { showToast("Library Excel belum siap", true); return; }
      const ws = XLSX.utils.aoa_to_sheet([ ["NAMA", "NISN", "KELAS", "MASA_BERLAKU", "LINK_FOTO"], ["DONI PUTRA", "12345", "9", "Juli 2027", ""] ]);
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Template");
      XLSX.writeFile(wb, "Template_Import_Anggota.xlsx");
    }

    function handleExcelUpload(e) {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = async function(evt) {
        try {
          showLoader(true, "Mengimport Excel...");
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, {type: 'array'});
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet);
          if(rows.length === 0) throw new Error("File kosong");
          
          const existingIds = new Set(appState.members.map(m => String(m.MemberID).trim()));
          
          const formatted = rows.map(r => ({
             name: String(r.NAMA || '').trim().toUpperCase(), memberId: String(r.NISN || '').trim(),
             class: String(r.KELAS || '').trim().toUpperCase(), validUntil: String(r.MASA_BERLAKU || 'Juli 2027'), photoUrl: String(r.LINK_FOTO || '')
          })).filter(r => r.name && r.memberId);

          if(formatted.length === 0) throw new Error("Format salah / tidak ada data.");
          
          const newMembers = formatted.filter(m => !existingIds.has(m.memberId));
          if(newMembers.length === 0) { throw new Error("Semua data dalam Excel sudah terdaftar (Ganda)."); }

          const res = await apiCall('bulk_add_members', newMembers);
          if(res) { showToast(res.message); await initApp(); }
        } catch(err) { showToast(err.message, true); showLoader(false); }
        e.target.value = ""; 
      };
      reader.readAsArrayBuffer(file);
    }

           <div style="flex: 1; text-align: center; font-family: 'Times New Roman', serif; line-height: 1;">
             <h4 style="margin: 0; font-size: 9pt; font-weight: bold; text-transform: uppercase;">${esc(s.govName)}</h4>
             <h4 style="margin: 0; font-size: 9pt; font-weight: bold; text-transform: uppercase;">${esc(s.deptName)}</h4>
             <h3 style="margin: 1px 0; font-size: 12pt; font-weight: 900; text-transform: uppercase;">${esc(s.schoolName)}</h3>

        </div>

              </div>
              
              <div style="text-align: center; margin-top: 14mm; font-size: 8pt; font-weight: 900; color:#064e3b; padding-bottom: 1mm; margin-left: 4mm; margin-right: 4mm; border-bottom: 1px solid #a7f3d0;">KARTU ANGGOTA PERPUSTAKAAN</div>
              
              <div style="position: absolute; left: 4mm; top: 21mm; width: 19mm; height: 25mm; border: 2px solid #e2e8f0; background: #f8fafc; border-radius: 4px; overflow: hidden;"><img src="${esc(m.PhotoUrl)||'https://api.dicebear.com/7.x/initials/svg?seed='+esc(m.Name)}" style="width:100%; height:100%; object-fit:cover;" crossorigin="anonymous" onerror="this.src='https://api.dicebear.com/7.x/initials/svg?seed=Err'"/></div>
              
              <div style="position: absolute; left: 25mm; top: 20mm; font-size: 5.5pt; font-weight: 800; line-height:1.5; color:#1e293b;">
                <table style="border-collapse: collapse; border: none; padding:0; margin:0;">
                  <tr style="border: none;"><td style="padding-bottom:0.5mm; width:12mm; border: none;">NAMA</td><td style="border: none;">:</td><td style="font-weight:900; border: none;">${esc(m.Name)}</td></tr>
                  <tr style="border: none;"><td style="padding-bottom:0.5mm; border: none;">NISN</td><td style="border: none;">:</td><td style="border: none;">${esc(m.MemberID)}</td></tr>
                  <tr style="border: none;"><td style="padding-bottom:0.5mm; border: none;">KELAS</td><td style="border: none;">:</td><td style="border: none;">${esc(m.Class)}</td></tr>
                  <tr style="border: none;"><td style="border: none;">BERLAKU</td><td style="border: none;">:</td><td style="border: none;">${esc(m.ValidUntil)}</td></tr>
                </table>
              </div>
              
              <div style="position: absolute; right: 2mm; bottom: 3.5mm;"><svg class="bc-c" data-val="${esc(m.MemberID)}"></svg></div>
              <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 2mm; background: linear-gradient(to right, #064e3b, #10b981, #064e3b);"></div>
            </div>

            <div style="width: 85.6mm; height: 53.98mm; background: white; border: 1px solid #ddd; border-radius: 8px; position: relative; overflow: hidden; font-family: sans-serif; color: black; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
              <div style="padding: 2.5mm; background: #059669; text-align: center; color: white;"><h3 style="margin: 0; font-size: 8pt; font-weight: 900; letter-spacing: 0.5px;">TATA TERTIB PERPUSTAKAAN</h3></div>
              <div style="padding: 2.5mm 4mm; text-align: left;">
                 <div style="font-size: 5pt; margin-bottom: 0.8mm; font-weight: 600; line-height: 1.4; color: #1e293b;">1. Kartu ini wajib dibawa setiap kali melakukan peminjaman atau pengembalian buku.</div>

    async function printReport(type) {
      if(type !== 'member_cards' && type !== 'book_barcodes') {
         if(type === 'available' && appState.books.filter(b=>b.Status==='available').length === 0) return;
         if(type === 'borrowed' && appState.loans.filter(l=>l.Status==='borrowed').length === 0) return;
         if(type === 'returned_history' && appState.loans.filter(l=>l.Status==='returned').length === 0) return;
         if(type === 'graduating' && appState.loans.filter(l=>{ const m=appState.members.find(x=>x.ID===l.MemberID); return l.Status==='borrowed' && (String(m?.Class||'').includes('9')||String(m?.Class||'').includes('XII')); }).length === 0) return;
         if(type === 'unpaid_fines' && appState.loans.filter(l=>l.FinePaid==='belum').length === 0) return;
         if(type === 'top_borrowers' && appState.loans.length === 0) return;
         if(type === 'top_books' && appState.loans.length === 0) return;
      }
      if (type === 'book_barcodes' && appState.books.length === 0) return;

      showLoader(true, "Merender PDF... Mohon Tunggu.");
      
      setTimeout(async () => {
        try {
          let title = "LAPORAN", ths = "", trs = "", html = "";
          
          if(type==='book_barcodes') {
            const selBook = $('book-select')?.value;
            const booksToPrint = selBook ? appState.books.filter(b => String(b.Title || "").trim().toUpperCase() === selBook) : appState.books;
            if(!booksToPrint.length) { showToast("Tidak ada data buku untuk dicetak", true); showLoader(false); return; }
            
            title = "BARCODE INVENTARIS BUKU";
            if(selBook) title += ` - ${selBook}`;
            
            let barcodeRows = [];
            let i = 0;
            while(i < booksToPrint.length) {
                let rowHtml = "";
                for(let j = 0; j < 3; j++) {
                  if(booksToPrint[i+j]) {
                    let b = booksToPrint[i+j];
                    rowHtml += `<div class="avoid-break" style="display:inline-block; width: 31%; margin: 1%; box-sizing: border-box; page-break-inside: avoid; break-inside: avoid; border: 1px dashed #94a3b8; padding: 3mm 2mm; text-align: center;">
                       <p style="font-size: 7pt; font-weight: 800; margin: 0 0 2mm 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${esc(b.Title)}</p>
                       <svg class="bc-b" data-val="${esc(b.ISBN||b.ID)}" style="width: 100%; height: 18mm;"></svg>
                    </div>`;
                  }
                }
                barcodeRows.push(`<div style="width:100%; text-align:center;">${rowHtml}</div>`);
                i += 3;
            }
            html = `<div style="padding:5mm 10mm; background:white;">${getKop(title)}${barcodeRows.join('')}</div>`;
          
          } else if (type==='member_cards') {
            const selClass = $('class-select').value;
            const members = selClass ? appState.members.filter(m => String(m.Class || "").trim().toUpperCase() === selClass) : appState.members;
            if(!members.length) { showToast("Tidak ada data untuk dicetak", true); showLoader(false); return; }
            title = `KARTU ANGGOTA KELAS: ${esc(selClass||'SEMUA')}`;
            html = `<div style="padding:10mm; background:white;"><h2 style="text-align:center; margin-bottom:10mm; font-family:sans-serif; font-size:14pt; font-weight:900;">${title}</h2>` + members.map(m => getCardHTML(m, appState.settings)).join('') + `</div>`;
          
          } else {
            if(type==='available'){ title="LAPORAN FISIK BUKU TERSEDIA"; ths="<th>No</th><th>ISBN/Barcode</th><th>Judul Buku</th><th>Penulis</th><th>Kategori</th>"; trs=appState.books.filter(b=>b.Status==='available').map((b,i)=>`<tr style="page-break-inside: avoid; break-inside: avoid;"><td>${i+1}</td><td>${esc(b.ISBN)}</td><td>${esc(b.Title)}</td><td>${esc(b.Author)}</td><td>${esc(b.Category)}</td></tr>`).join(''); }
            else if(type==='borrowed'){ title="LAPORAN PEMINJAMAN AKTIF"; ths="<th>No</th><th>Judul Buku</th><th>Nama Peminjam</th><th>Tgl Pinjam</th>"; trs=appState.loans.filter(l=>l.Status==='borrowed').map((l,i)=>`<tr style="page-break-inside: avoid; break-inside: avoid;"><td>${i+1}</td><td>${esc(l.BookTitle)}</td><td>${esc(l.MemberName)}</td><td>${formatDateStr(l.LoanDate)}</td></tr>`).join(''); }
            else if(type==='returned_history'){ title="RIWAYAT PENGEMBALIAN SUKSES"; ths="<th>No</th><th>Judul Buku</th><th>Nama Peminjam</th><th>Tgl Kembali</th>"; trs=appState.loans.filter(l=>l.Status==='returned').map((l,i)=>`<tr style="page-break-inside: avoid; break-inside: avoid;"><td>${i+1}</td><td>${esc(l.BookTitle)}</td><td>${esc(l.MemberName)}</td><td>${formatDateStr(l.ReturnDate)}</td></tr>`).join(''); }
            else if(type==='graduating'){ title="LAPORAN TUNGGAKAN SISWA AKHIR (SYARAT BEBAS PUSTAKA)"; ths="<th>No</th><th>Nama Siswa</th><th>Kelas</th><th>Buku Dipinjam</th>"; trs=appState.loans.filter(l=>{ const m=appState.members.find(x=>x.ID===l.MemberID); return l.Status==='borrowed' && (String(m?.Class||'').includes('9')||String(m?.Class||'').includes('XII')); }).map((l,i)=>{ const m=appState.members.find(x=>x.ID===l.MemberID); return `<tr style="page-break-inside: avoid; break-inside: avoid;"><td>${i+1}</td><td>${esc(l.MemberName)}</td><td>${m?esc(m.Class):'-'}</td><td>${esc(l.BookTitle)}</td></tr>`;}).join(''); }
            else if(type==='unpaid_fines'){ title="LAPORAN DENDA KETERLAMBATAN BELUM LUNAS"; ths="<th>No</th><th>Anggota</th><th>Kelas</th><th>Buku</th><th>Tgl Kembali</th><th>Denda</th>"; trs=appState.loans.filter(l=>l.FinePaid==='belum').map((l,i)=>{ const m=appState.members.find(x=>x.ID===l.MemberID); return `<tr style="page-break-inside: avoid; break-inside: avoid;"><td>${i+1}</td><td>${esc(l.MemberName)}</td><td>${m?esc(m.Class):'-'}</td><td>${esc(l.BookTitle)}</td><td>${formatDateStr(l.ReturnDate)}</td><td>${formatRupiah(l.Fine)}</td></tr>`;}).join(''); }
            else if(type==='top_borrowers'){ title="LAPORAN ANGGOTA PALING AKTIF"; ths="<th>No</th><th>Nama</th><th>Kelas</th><th>Jumlah Peminjaman</th>";
              const bc={}; appState.loans.forEach(l=>{ if(!l.MemberID) return; bc[l.MemberID]=(bc[l.MemberID]||0)+1; });
              const tb=Object.entries(bc).map(([mid,count])=>{ const m=appState.members.find(x=>x.ID===mid); const fb=(appState.loans.find(l=>l.MemberID===mid)||{}).MemberName||'Anggota Dihapus'; return {name:m?m.Name:fb, cls:m?m.Class:'-', count}; }).sort((a,b)=>b.count-a.count);
              trs=tb.map((b,i)=>`<tr style="page-break-inside: avoid; break-inside: avoid;"><td>${i+1}</td><td>${esc(b.name)}</td><td>${esc(b.cls)}</td><td>${b.count}x</td></tr>`).join(''); }
            else if(type==='top_books'){ title="LAPORAN BUKU TERPOPULER"; ths="<th>No</th><th>Judul Buku</th><th>Jumlah Dipinjam</th>";
              const bc={}; appState.loans.forEach(l=>{ if(!l.BookTitle) return; bc[l.BookTitle]=(bc[l.BookTitle]||0)+1; });
              const tb=Object.entries(bc).map(([bt,count])=>({title:bt,count})).sort((a,b)=>b.count-a.count);
              trs=tb.map((b,i)=>`<tr style="page-break-inside: avoid; break-inside: avoid;"><td>${i+1}</td><td>${esc(b.title)}</td><td>${b.count}x</td></tr>`).join(''); }
            html = `<div style="padding:10mm; background:white;">${getKop(title)}<style>table.r-table{width:100%; border-collapse:collapse; font-size:8pt; margin-top:5mm;} table.r-table tr{page-break-inside:avoid; break-inside: avoid;} table.r-table th, table.r-table td{border:1px solid #333; padding:2mm; text-align:left;} table.r-table th{background:#e2e8f0; font-weight:bold;} thead{display:table-header-group;}</style><table class="r-table"><thead><tr>${ths}</tr></thead><tbody>${trs||'<tr><td colspan="6" style="text-align:center;">Nihil.</td></tr>'}</tbody></table><div style="margin-top: 15mm; font-family: sans-serif; display: flex; justify-content: space-between; width: 100%; page-break-inside: avoid; break-inside: avoid;"><div style="text-align: center; width: 40%;"><p style="margin: 0; font-size: 9pt;">Mengetahui,</p><p style="margin: 0; font-size: 9pt; font-weight: bold;">Kepala Sekolah</p><div style="height: 15mm;"></div><p style="margin: 0; font-size: 9pt; font-weight: bold; text-decoration: underline;">${esc(appState.settings.principalName)}</p><p style="margin: 0; font-size: 9pt;">NIP. ${esc(appState.settings.principalNip)}</p></div><div style="text-align: center; width: 40%;"><p style="margin: 0; font-size: 9pt;">${esc(appState.settings.city)}, ${new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}</p><p style="margin: 0; font-size: 9pt; font-weight: bold;">Kepala Perpustakaan</p><div style="height: 15mm;"></div><p style="margin: 0; font-size: 9pt; font-weight: bold; text-decoration: underline;">${esc(appState.settings.librarianName)}</p><p style="margin: 0; font-size: 9pt;">NIP. ${esc(appState.settings.librarianNip)}</p></div></div></div>`;
          }
          
          const div = document.createElement('div'); div.innerHTML = html; document.body.appendChild(div);
          
          div.querySelectorAll('.bc-c').forEach(svg=> { try { JsBarcode(svg, svg.getAttribute('data-val'), {format:"CODE128", width:1.5, height:25, displayValue:true, fontSize:10, fontOptions:"bold", margin:0, background: "transparent"}); } catch(e){} });
          div.querySelectorAll('.bc-b').forEach(svg=> { try { JsBarcode(svg, svg.getAttribute('data-val'), {format:"CODE128", width:1.5, height:35, displayValue:true, fontSize:13, fontOptions:"bold", margin:0, background: "transparent"}); } catch(e){} });
          
          await html2pdf().set({
            margin: type === 'member_cards' ? [5, 0, 5, 0] : [5, 5, 5, 5], 
            filename: title.replace(/\s+/g,'_')+'.pdf', 
            image:{type:'jpeg', quality:1}, 
            html2canvas:{scale:2, useCORS:true, allowTaint:true}, 
            jsPDF:{unit:'mm', format:'a4', orientation:'portrait'},
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
          }).from(div).save();
          
          document.body.removeChild(div);
        } catch(error) {
          console.error(error);
          showToast("Gagal memproses PDF", true);
        } finally {
          showLoader(false);
        }
      }, 300);
    }

    async function printCard(id) {
      showLoader(true, "Merender Kartu..."); 
      setTimeout(async () => {
        try {
          const m = appState.members.find(x=>x.ID===id);
          const div = document.createElement('div'); div.style.padding = '10mm'; div.innerHTML = getCardHTML(m, appState.settings); document.body.appendChild(div);
          div.querySelectorAll('.bc-c').forEach(svg=> { try { JsBarcode(svg, svg.getAttribute('data-val'), {format:"CODE128", width:1.5, height:25, displayValue:true, fontSize:10, fontOptions:"bold", margin:0, background: "transparent"}); } catch(e){} });
          await html2pdf().set({margin:[5, 5, 5, 5], filename:'Kartu_'+m.Name+'.pdf', image:{type:'jpeg', quality:1}, html2canvas:{scale:3, useCORS:true, allowTaint:true}, jsPDF:{unit:'mm', format:'a4'}, pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }}).from(div).save();
          document.body.removeChild(div); 
        } finally { showLoader(false); }
      }, 300);
    }

    let appBooted = false; function bootApp() { if(appBooted) return; appBooted = true; initApp(); }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', bootApp); } else { bootApp(); }
    setTimeout(bootApp, 1000);
  </script>
