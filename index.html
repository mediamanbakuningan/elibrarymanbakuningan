<style>
    body { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #cbd5e1 100%); background-attachment: fixed; font-family: 'Inter', system-ui, sans-serif; color: #1e293b; margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    .glass-panel { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }

    .header-box { background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(241,245,249,0.9) 100%); border: 1px solid rgba(255,255,255,1); box-shadow: inset 0 2px 4px rgba(255,255,255,0.8), 0 4px 10px rgba(0,0,0,0.05); border-radius: 1.5rem; padding: 1.5rem 2rem; border-left: 8px solid #059669; }

    .text-3d-elegant {

      -webkit-text-fill-color: transparent;

    }

    .platinum-gradient { background: linear-gradient(to right, #047857, #064e3b, #047857); background-size: 200% auto; color: white; transition: 0.5s; }
    .platinum-gradient:hover { background-position: right center; }
    .metallic-text { background: linear-gradient(to right, #064e3b, #022c22, #064e3b); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .hide { display: none !important; }
    .app-viewport { height: 100vh; height: 100dvh; }
    .scroll-smooth { -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 1.5rem); }
    .hide-scroll::-webkit-scrollbar { display: none; }
</style>

<body>

  <div id='e-library-app'>

             <div><label class='text-[10px] font-black text-slate-500 uppercase tracking-widest'>Berlaku s/d</label><input class='w-full mt-1 p-4 bg-white/60 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-400 border border-white/50 shadow-sm' id='member-valid' placeholder='Juli 2027' required type='text'/></div>

  <script type='text/javascript'>
    // =========================================================================
    // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    // =========================================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzd7tQQZy4tHkP8_0csSbrqLARbzqHoS6LDPJg_KZHmNioc6XT6DbxzOhBSnfFMl4sQnQ/exec";

    let appState = { activeTab: 'dashboard', setupError: false, books: [], members: [], loans: [], visits: [], settings: { schoolName: 'PERPUSTAKAAN PLATINUM', logoLeft: '', logoRight: '' } };
    let scanMode = 'loan', html5QrcodeScanner = null, activeScanTarget = null;
    const $ = (id) => document.getElementById(id);

    const esc = (str) => { if (!str) return ''; return String(str).replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":"&#39;",'"':"&quot;"}[t] || t)); };
    const formatDateStr = (s) => { if(!s) return "-"; if(String(s).includes('T')) { try { const d = new Date(s); if (!isNaN(d.getTime())) return d.toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'}); } catch(e) {} } return s; };
    const formatRupiah = (n) => { const num = Number(n) || 0; return 'Rp ' + num.toLocaleString('id-ID'); };
    const todayStr = () => new Date().toISOString().slice(0, 10);

    // --- SWEETALERT ---
    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true });
    function showToast(msg, isError = false) { Toast.fire({ icon: isError ? 'error' : 'success', title: msg }); }
    function showLoader(show, text="Memproses...") {
      if(show) { Swal.fire({ title: text, allowOutsideClick: false, allowEscapeKey: false, showConfirmButton: false, didOpen: () => { Swal.showLoading(); } }); }
      else { Swal.close(); }
    }
    function toggleModal(id, show) { const m = $(id); if(!m) return; if(show) m.classList.remove('hide'); else m.classList.add('hide'); }

    async function apiCall(action, payload = {}, extraParams = {}) {
      if (GAS_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_URL_HERE")) { appState.setupError = true; return null; }
      try {
        const params = new URLSearchParams({ action: action, payload: JSON.stringify(payload), ...extraParams });
        const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params });
        const json = await res.json();
        if(json.status === 'error') throw new Error(json.message);
        return json;
      } catch (err) {
        console.error("API Call Failed:", err);
        showToast(err.message || "Gagal menghubungi server", true);
        return null;
      }
    }

    async function initApp() {
      try {
        showLoader(true, "Menghubungkan Server...");
        if($('current-date-disp')) $('current-date-disp').innerText = new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

        if (GAS_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_URL_HERE")) { appState.setupError = true; switchTab('dashboard'); showLoader(false); return; }
        const res = await apiCall('get_all_data');
        if (res && res.data) {
          appState.setupError = false;
          appState.books = res.data.books || [];
          appState.members = res.data.members || [];
          appState.loans = res.data.loans || [];
          appState.visits = res.data.visits || [];
          appState.settings = res.data.settings || {};
        } else { appState.setupError = true; }
        switchTab(appState.activeTab);
      } catch (e) { appState.setupError = true; switchTab('dashboard'); } finally { showLoader(false); }
    }

    // ================== PWA ==================
    function drawPwaIcon(size) {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, size, size);
      g.addColorStop(0, '#047857'); g.addColorStop(0.5, '#064e3b'); g.addColorStop(1, '#047857');
      const r = size * 0.22;
      x.beginPath();
      if (x.roundRect) { x.roundRect(0, 0, size, size, r); }
      else { x.moveTo(r,0); x.lineTo(size-r,0); x.quadraticCurveTo(size,0,size,r); x.lineTo(size,size-r); x.quadraticCurveTo(size,size,size-r,size); x.lineTo(r,size); x.quadraticCurveTo(0,size,0,size-r); x.lineTo(0,r); x.quadraticCurveTo(0,0,r,0); }
      x.fillStyle = g; x.fill();
      // Ikon lucide "library" — sama seperti logo sidebar
      x.strokeStyle = '#ffffff'; x.lineWidth = size / 13; x.lineCap = 'round'; x.lineJoin = 'round';
      const L = (a, b, c2, d) => { x.beginPath(); x.moveTo(a * size, b * size); x.lineTo(c2 * size, d * size); x.stroke(); };
      L(4/24, 4/24, 4/24, 20/24);
      L(8/24, 8/24, 8/24, 20/24);
      L(12/24, 6/24, 12/24, 20/24);
      L(16/24, 6/24, 20/24, 20/24);
      return c.toDataURL('image/png');
    }

    function initPwa() {
      try {
        const icon192 = drawPwaIcon(192), icon512 = drawPwaIcon(512);
        // Jika manifest.json statis tidak tersedia di hosting, generate manifest dinamis (logo dari HTML)
        fetch('manifest.json', { method: 'HEAD' }).then(r => {
          if (!r.ok) {
            const manifest = {
              name: 'E-LIBRARY — Sistem Perpustakaan Digital Sekolah',
              short_name: 'E-LIBRARY',
              description: 'Sistem Informasi Perpustakaan Sekolah (SI-PUS)',
              start_url: location.href.split('#')[0].split('?')[0],
              scope: './',
              display: 'standalone',
              background_color: '#f8fafc',
              theme_color: '#047857',
              icons: [
                { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
                { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
                { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
              ]
            };
            const link = document.querySelector('link[rel="manifest"]');
            if (link) link.remove();
            const l = document.createElement('link');
            l.rel = 'manifest';
            l.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
            document.head.appendChild(l);
          }
        }).catch(() => {});
        const apple = document.createElement('link');
        apple.rel = 'apple-touch-icon'; apple.href = icon192;
        document.head.appendChild(apple);
        if ('serviceWorker' in navigator) {
          fetch('sw.js', { method: 'HEAD' }).then(r => { if (r.ok) navigator.serviceWorker.register('sw.js'); }).catch(() => {});
        }
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault(); window.deferredPrompt = e;
          const b = $('btn-install'); if (b) b.classList.remove('hide');
        });
      } catch (e) { console.warn('PWA init gagal:', e); }
    }

    function installApp() {
      const p = window.deferredPrompt;
      if (!p) { showToast("Gunakan menu browser → 'Tambahkan ke Layar Utama' untuk memasang aplikasi."); return; }
      p.prompt();
      p.userChoice.then(() => { window.deferredPrompt = null; const b = $('btn-install'); if (b) b.classList.add('hide'); });
    }

    // ================== NAVIGASI ==================
    function switchTab(tabId) {
      appState.activeTab = tabId;
      const schoolName = appState.settings.schoolName || 'PERPUSTAKAAN PLATINUM';
      const labels = {
        'dashboard': { title: 'BERANDA PERPUSTAKAAN', sub: esc(schoolName) },
        'books': { title: 'INVENTARIS BUKU', sub: esc(schoolName) },

    function downloadExcelTemplate() {
      const data = [
        { memberId: '0012345678', name: 'Contoh Siswa Satu', class: '7A', validUntil: 'Juli 2027', photoUrl: '' },
        { memberId: '0012345679', name: 'Contoh Siswa Dua', class: '7B', validUntil: 'Juli 2027', photoUrl: '' }
      ];
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Members");
      XLSX.writeFile(wb, "Template_Anggota_E-Library.xlsx");
      showToast("Template Excel diunduh.");
    }

    async function handleExcelUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      showLoader(true, "Membaca file Excel...");
      try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf);
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
        const mapped = rows.map(r => ({
          memberId: String(r.memberId || r['ID Anggota'] || r.NISN || '').trim(),
          name: String(r.name || r['Nama'] || '').trim(),
          class: String(r.class || r['Kelas'] || '').trim(),
          validUntil: String(r.validUntil || r['Berlaku'] || 'Juli 2027').trim(),
          photoUrl: String(r.photoUrl || r['Foto'] || '').trim()
        })).filter(r => r.memberId && r.name);
        if (!mapped.length) throw new Error("Tidak ada data valid. Gunakan tombol Template untuk format yang benar.");
        showLoader(false);
        showLoader(true, "Mengupload " + mapped.length + " data...");
        const res = await apiCall('bulk_add_members', mapped);
        showLoader(false);
        if (res) { showToast(res.message); await initApp(); }
      } catch (err) {
        showLoader(false);
        showToast(err.message, true);
      }
      e.target.value = '';
    }

    function setScanMode(mode) {
      scanMode = mode;
      const base = 'flex-1 py-3 md:py-4 rounded-[1rem] md:rounded-3xl font-black text-[9px] md:text-sm tracking-widest transition ';
      ['loan', 'return', 'visit'].forEach(m => {
        if ($('tab-' + m)) $('tab-' + m).className = base + (mode === m ? 'platinum-gradient shadow-md' : 'text-slate-400 hover:bg-slate-50');
      });
      if ($('scan-title')) $('scan-title').innerText = `MODE ${mode === 'loan' ? 'PEMINJAMAN' : mode === 'return' ? 'PENGEMBALIAN' : 'KUNJUNGAN PERPUS'}`;
      if ($('circ-book-group')) {
        $('circ-book-group').classList.toggle('hide', mode === 'visit');
        if ($('circ-book')) $('circ-book').required = (mode !== 'visit');
      }
    }

    async function submitCirculation(e) {
      e.preventDefault();
      const memberId = $('circ-member').value.trim();
      const bookId = $('circ-book') ? $('circ-book').value.trim() : '';

      if (scanMode === 'visit') {
        showLoader(true, "Mencatat kunjungan...");
        const res = await apiCall('record_visit', { memberId });
        showLoader(false);
        if (res) { showToast(res.message); $('circ-member').value = ''; await initApp(); }
        return;
      }

      showLoader(true, "Memproses transaksi...");
      const res = await apiCall('process_circulation', { bookId, memberId, mode: scanMode });
      showLoader(false);
      if (res) {
        showToast(res.message);
        $('circ-book').value = '';
        $('circ-member').value = '';
        await initApp();
      }
    }

    // ================== STATISTIK (AKUMULASI KEAKTIFAN %) ==================
    function getActivityData() {
      const visitCounts = {}, loanCounts = {};
      appState.visits.forEach(v => { if (!v.MemberID) return; visitCounts[v.MemberID] = (visitCounts[v.MemberID] || 0) + 1; });
      appState.loans.forEach(l => { if (!l.MemberID) return; loanCounts[l.MemberID] = (loanCounts[l.MemberID] || 0) + 1; });
      const rows = appState.members.map(m => {
        const visits = visitCounts[m.ID] || 0, loans = loanCounts[m.ID] || 0;
        return { name: m.Name, cls: m.Class, visits, loans, score: visits + loans };
      }).filter(r => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 10);
      const totalScore = rows.reduce((s, r) => s + r.score, 0) || 1;
      rows.forEach(r => { r.pctOfTotal = (r.score / totalScore) * 100; });
      const maxScore = rows.length ? rows[0].score : 1;
      rows.forEach(r => { r.pctOfMax = (r.score / maxScore) * 100; });
      return { rows, maxScore, totalScore };
    }

    async function runPdfExport(element, filename) {
      showLoader(true, "Menyiapkan PDF...");
      try {
        await html2pdf().set({
          margin: [8, 8, 8, 8],
          filename: filename,
          image: { type: 'jpeg', quality: 0.98 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          html2canvas: { scale: 2, useCORS: true }
        }).from(element).save();
        showToast("PDF berhasil diunduh.");
      } catch (e) { showToast("Gagal membuat PDF: " + e.message, true); }
      showLoader(false);
    }

        const sel = $('class-select') ? $('class-select').value : '';

        if (!members.length) { showToast("Tidak ada data anggota untuk kelas ini.", true); return; }
        area.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:4mm;">${members.map(buildMemberCardHTML).join('')}</div>`;

              <thead><tr style="background:#064e3b;color:#fff;">
                <th style="padding:7px 8px;font-size:9px;">#</th>
                <th style="padding:7px 8px;font-size:9px;text-align:left;">Nama</th>
                <th style="padding:7px 8px;font-size:9px;text-align:left;">Kelas</th>
                <th style="padding:7px 8px;font-size:9px;">Masuk</th>
                <th style="padding:7px 8px;font-size:9px;">Pinjam</th>
                <th style="padding:7px 8px;font-size:9px;">Total</th>
                <th style="padding:7px 8px;font-size:9px;">Keaktifan</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
        await runPdfExport(area, 'Laporan_Keaktifan_Anggota.pdf');
      }
      area.innerHTML = '';
    }

    async function printCard(memberId) {
      const m = appState.members.find(x => x.ID === memberId);
      if (!m) { showToast("Anggota tidak ditemukan.", true); return; }
      const area = $('print-area');
      area.innerHTML = `<div>${buildMemberCardHTML(m)}</div>`;
      generateBarcodesIn(area);
      await new Promise(r => setTimeout(r, 400));
      await runPdfExport(area, 'Kartu_' + esc(m.Name) + '.pdf');
      area.innerHTML = '';
    }

    // ================== PENGATURAN ==================
    function getSettingsHTML() {
      if (appState.setupError) return getDashboardHTML();
      return `
        <div class="max-w-2xl mx-auto bg-white p-6 md:p-10 rounded-[2rem] md:rounded-[2.5rem] shadow-xl border border-slate-100">
          <h3 class="font-black text-slate-800 text-lg md:text-2xl mb-2">Pengaturan Sistem</h3>
          <p class="text-xs text-slate-400 font-bold mb-8">Konfigurasi identitas perpustakaan dan aturan sirkulasi.</p>
          <form onsubmit="submitSettings(event)" class="space-y-5">
            <div><label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Nama Perpustakaan / Sekolah</label><input id="set-school" type="text" class="w-full mt-1 p-4 bg-slate-50 rounded-2xl border border-slate-200 outline-none focus:ring-2 focus:ring-emerald-500 font-bold"/></div>
            <div class="grid grid-cols-2 gap-4">
              <div><label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Logo Kiri (URL)</label><input id="set-logoL" type="text" placeholder="https://..." class="w-full mt-1 p-4 bg-slate-50 rounded-2xl border border-slate-200 outline-none focus:ring-2 focus:ring-emerald-500 text-xs"/></div>
              <div><label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Logo Kanan (URL)</label><input id="set-logoR" type="text" placeholder="https://..." class="w-full mt-1 p-4 bg-slate-50 rounded-2xl border border-slate-200 outline-none focus:ring-2 focus:ring-emerald-500 text-xs"/></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div><label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Durasi Pinjam (Hari)</label><input id="set-duration" type="number" min="1" class="w-full mt-1 p-4 bg-slate-50 rounded-2xl border border-slate-200 outline-none focus:ring-2 focus:ring-emerald-500 font-bold text-center"/></div>
              <div><label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Denda / Hari (Rp)</label><input id="set-fine" type="number" min="0" class="w-full mt-1 p-4 bg-slate-50 rounded-2xl border border-slate-200 outline-none focus:ring-2 focus:ring-emerald-500 font-bold text-center"/></div>
            </div>
            <button type="submit" class="w-full platinum-gradient py-4 rounded-2xl font-black shadow-lg tracking-widest">SIMPAN PENGATURAN</button>
          </form>
        </div>
      `;
    }

    function populateSettings() {
      const s = appState.settings || {};
      if ($('set-school')) $('set-school').value = s.schoolName || '';
      if ($('set-logoL')) $('set-logoL').value = s.logoLeft || '';
      if ($('set-logoR')) $('set-logoR').value = s.logoRight || '';
      if ($('set-duration')) $('set-duration').value = parseInt(s.loanDurationDays) || 7;
      if ($('set-fine')) $('set-fine').value = parseFloat(s.finePerDay) || 0;
    }

    async function submitSettings(e) {
      e.preventDefault();
      const payload = {
        schoolName: $('set-school').value.trim(),
        logoLeft: $('set-logoL').value.trim(),
        logoRight: $('set-logoR').value.trim(),
        loanDurationDays: $('set-duration').value,
        finePerDay: $('set-fine').value
      };
      showLoader(true, "Menyimpan pengaturan...");
      const res = await apiCall('save_settings', payload);
      showLoader(false);
      if (res) { showToast(res.message); await initApp(); }
    }

    // ================== HAPUS DATA ==================
    async function deleteItem(sheet, id) {
      const result = await Swal.fire({ title: 'Hapus Data?', text: "Data yang dihapus tidak dapat dikembalikan.", icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc2626', cancelButtonColor: '#64748b', confirmButtonText: 'Ya, Hapus', cancelButtonText: 'Batal' });
      if(!result.isConfirmed) return;
      showLoader(true, "Menghapus...");
      const res = await apiCall('delete_item', {}, { sheet: sheet, id: id });
      if(res){ showToast(res.message); await initApp(); } else { showLoader(false); }
    }

    // ================== SCANNER ==================
    function openScanner(targetId) {
      if(!window.Html5Qrcode) { showToast("Library Scanner lambat dimuat.", true); return; }
      activeScanTarget = targetId; $('scanner-modal').classList.remove('hide');
      if(!html5QrcodeScanner) html5QrcodeScanner = new Html5Qrcode("reader");
      const config = { fps: 20, qrbox: { width: 250, height: 120 }, aspectRatio: 1.0, formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.QR_CODE ] };
      html5QrcodeScanner.start({ facingMode: "environment" }, config, (decodedText) => {
        if(activeScanTarget && $(activeScanTarget)) { $(activeScanTarget).value = decodedText.trim().replace(/\s/g, '_'); }
        showToast("Terbaca: " + decodedText); closeScanner();
      }, (error) => {}).catch((err) => { showToast("Kamera tidak diizinkan/ditemukan.", true); closeScanner(); });
    }
    function closeScanner() { $('scanner-modal').classList.add('hide'); if(html5QrcodeScanner) html5QrcodeScanner.stop().catch(e=>{}); activeScanTarget = null; }

    // ================== INIT ==================
    window.addEventListener('load', () => { initPwa(); initApp(); });
  </script>
</body>
</html>
